<div class="page">
  <header class="page__header">
    <div>
      <h1 class="page__title">{{ title }}</h1>
      <p class="page__subtitle">This section is part of a later delivery.</p>
    </div>
  </header>

  <div class="placeholder card">
    <app-icon [name]="icon" [size]="28"></app-icon>
    <p class="placeholder__title">{{ title }} is not available yet</p>
    <p class="placeholder__text">The screens for this area will be added once the designs are signed off.</p>
  </div>
</div>
