<div class="popup" [class]="'popup--' + (config.variant || 'default')">
  @if (config.showHeader) {
    <header class="popup__header">
      <div class="popup__heading">
        @if (iconName) {
          <span class="popup__icon">
            <app-icon [name]="iconName" [size]="20"></app-icon>
          </span>
        }
        <div>
          <h2 class="popup__title">{{ config.title }}</h2>
          @if (config.subtitle) {
            <p class="popup__subtitle">{{ config.subtitle }}</p>
          }
        </div>
      </div>

      @if (config.showClose) {
        <button type="button" class="popup__close" aria-label="Close" (click)="onClose()">
          <app-icon name="close" [size]="18"></app-icon>
        </button>
      }
    </header>
  }

  <div class="popup__body">
    <ng-container #content></ng-container>
  </div>

  @if (actions.length) {
    <footer class="popup__footer">
      @for (action of actions; track action.id) {
        <button type="button" class="btn" [class]="buttonClass(action)" [disabled]="action.disabled" (click)="onAction(action)">
          {{ action.label }}
        </button>
      }
    </footer>
  }
</div>
