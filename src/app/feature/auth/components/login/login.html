<section class="auth-card">
  <h1 class="auth-card__title">Secure Sign In</h1>
  <p class="auth-card__subtitle">Access the disaster management console.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="auth-field">
      <label class="form-label" for="login-email">Email</label>
      <input
        id="login-email"
        class="form-control"
        type="email"
        formControlName="email"
        placeholder="name@dmc.gov.lk"
        autocomplete="username"
      />
      <form-control-error [control]="form.controls.email" fieldName="Email"></form-control-error>
    </div>

    <div class="auth-field">
      <label class="form-label text-uppercase" for="login-password">Password</label>
      <div class="password-field">
        <input
          id="login-password"
          class="form-control"
          [type]="showPassword() ? 'text' : 'password'"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
        <button
          type="button"
          class="password-field__toggle"
          [attr.aria-label]="showPassword() ? 'Hide password' : 'Show password'"
          (click)="togglePassword()"
        >
          <app-icon [name]="showPassword() ? 'eye-off' : 'eye'" [size]="18"></app-icon>
        </button>
      </div>
      <form-control-error [control]="form.controls.password" fieldName="Password"></form-control-error>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-4">
      <div class="form-check mb-0">
        <input id="remember" class="form-check-input" type="checkbox" formControlName="rememberDevice" />
        <label class="form-check-label small" for="remember">Remember this device</label>
      </div>
      <a class="auth-link" routerLink="/auth/forgot-password">Forgot password?</a>
    </div>

    <button class="btn btn-primary auth-form__submit" type="submit" [disabled]="submitting()">
      @if (submitting()) {
        <span class="spinner-border spinner-border-sm me-2"></span>
      }
      Sign In
    </button>
  </form>

  <div class="login-support">
    <p class="login-support__title">Internal Support</p>
    <div class="login-support__links">
      <a class="auth-link auth-link--muted" href="javascript:void(0)">
        <app-icon name="info" [size]="16"></app-icon> Help Center
      </a>
      <a class="auth-link auth-link--muted" href="javascript:void(0)">
        <app-icon name="bell" [size]="16"></app-icon> Contact Admin
      </a>
    </div>
  </div>
</section>
