<section class="auth-card auth-card--centered">
  <span class="auth-card__badge auth-card__badge--solid">
    <app-icon name="mail-check" [size]="26"></app-icon>
  </span>

  <h1 class="auth-card__title">Check Your Email</h1>
  <p class="auth-card__subtitle">We've sent a password reset link to your official email address:</p>

  <span class="auth-card__mail">{{ email() }}</span>

  <button class="btn btn-primary auth-form__submit" type="button" (click)="openEmailApp()">
    Open Email App <app-icon name="external-link" [size]="16"></app-icon>
  </button>

  <p class="resend">
    Didn't receive the email?
    <button type="button" class="auth-link" [disabled]="cooldown() > 0" (click)="resend()">
      @if (cooldown() > 0) {
        Resend in {{ cooldown() }}s
      } @else {
        Resend link
      }
    </button>
  </p>

  <p class="auth-card__action">
    <a class="auth-link auth-link--muted" routerLink="/auth/login">
      <app-icon name="arrow-left" [size]="16"></app-icon> Back to Login
    </a>
  </p>
</section>
