<section class="auth-card auth-card--centered">
  <span class="auth-card__badge">
    <app-icon name="lock-reset" [size]="26"></app-icon>
  </span>

  <h1 class="auth-card__title">Reset Your Password</h1>
  <p class="auth-card__subtitle">Enter your official email address to receive a password reset link.</p>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
    <div class="auth-field">
      <label class="form-label" for="forgot-email">Email</label>
      <input
        id="forgot-email"
        class="form-control"
        type="email"
        formControlName="email"
        placeholder="name@dmc.gov.lk"
        autocomplete="username"
      />
      <form-control-error [control]="form.controls.email" fieldName="Email"></form-control-error>
    </div>

    <button class="btn btn-primary auth-form__submit" type="submit" [disabled]="submitting()">
      Send Reset Link <app-icon name="arrow-right" [size]="16"></app-icon>
    </button>
  </form>

  <p class="auth-card__action">
    <a class="auth-link" routerLink="/auth/login">
      <app-icon name="arrow-left" [size]="16"></app-icon> Back to Login
    </a>
  </p>
</section>
